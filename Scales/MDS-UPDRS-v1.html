<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MDS-UPDRS Teil III: Motorische Untersuchung</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            line-height: 1.6;
            color: #333;
            background-color: #f4f4f9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        #app-container {
            width: 100%;
            max-width: 800px;
            background: #fff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        h1, h2 {
            text-align: center;
            color: #2c3e50;
        }
        #question-container {
            margin-top: 20px;
            min-height: 300px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .question-title {
            font-size: 1.5em;
            font-weight: bold;
            color: #34495e;
            margin-bottom: 25px;
            text-align: center;
        }
        .option {
            margin: 10px auto;
            display: block;
            cursor: pointer;
            padding: 10px 15px;
            border-radius: 5px;
            border: 1px solid #ddd;
            width: 90%;
            max-width: 500px;
            transition: background-color 0.2s, border-color 0.2s;
        }
        .option:hover {
            background-color: #f8f9fa;
            border-color: #3498db;
        }
        .option input {
            margin-right: 12px;
        }
        .option label {
            cursor: pointer;
        }
        .option-score {
            font-weight: bold;
            display: inline-block;
            width: 20px;
            color: #3498db;
        }
        #navigation {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 20px;
        }
        button {
            padding: 12px 25px;
            border: none;
            border-radius: 5px;
            background-color: #3498db;
            color: white;
            font-size: 1em;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        button:hover {
            background-color: #2980b9;
        }
        button:disabled {
            background-color: #bdc3c7;
            cursor: not-allowed;
        }
        #progress-bar-container {
            width: 100%;
            background-color: #ecf0f1;
            border-radius: 5px;
            margin: 20px 0;
        }
        #progress-bar {
            width: 0%;
            height: 10px;
            background-color: #2ecc71;
            border-radius: 5px;
            transition: width 0.3s ease;
        }
        #progress-text {
            text-align: center;
            font-size: 0.9em;
            color: #7f8c8d;
        }
        #results-container {
            text-align: center;
            display: none;
        }
        .results-actions {
            margin-top: 30px;
            display: flex;
            justify-content: center;
            gap: 15px;
        }
        #total-score-display {
            margin-bottom: 30px;
        }
        #total-score {
            font-size: 3em;
            font-weight: bold;
            color: #27ae60;
        }
        #detailed-results {
            text-align: left;
            margin-top: 20px;
            max-height: 400px;
            overflow-y: auto;
        }
        #detailed-results table {
            width: 100%;
            border-collapse: collapse;
        }
        #detailed-results th, #detailed-results td {
            padding: 10px;
            border-bottom: 1px solid #ddd;
        }
        #detailed-results th {
            background-color: #f2f2f2;
            font-weight: bold;
        }
        #detailed-results .score-cell {
            text-align: center;
            font-weight: bold;
        }

        /* --- STYLES FOR PRINTING --- */
        @media print {
            body {
                background-color: #fff;
            }
            body * {
                visibility: hidden;
            }
            #results-container, #results-container * {
                visibility: visible;
            }
            #app-container {
                position: absolute;
                left: 0;
                top: 0;
                width: 100%;
                box-shadow: none;
                border: none;
                padding: 0;
                margin: 0;
            }
            h2 {
                margin-top: 0;
                padding-top: 0px; /* Add some space at the top of the page */
            }
            .results-actions {
                display: none; /* Hide buttons in printout */
            }
            #detailed-results {
                max-height: none; /* Show full table without scroll */
                overflow-y: visible;
            }
        }
    </style>
</head>
<body>

    <div id="app-container">
        <h1>MDS-UPDRS Teil III: Motorische Untersuchung</h1>
        
        <div id="progress-container">
            <div id="progress-bar-container">
                <div id="progress-bar"></div>
            </div>
            <div id="progress-text">Seite 1</div>
        </div>

        <div id="question-container">
            <!-- Questions will be dynamically inserted here -->
        </div>

        <div id="navigation">
            <button id="prev-btn" onclick="prevPage()" disabled>Zurück</button>
            <button id="next-btn" onclick="nextPage()">Weiter</button>
        </div>

        <div id="results-container">
            <h2>Auswertung abgeschlossen</h2>
            <div id="total-score-display">
                <p>Ihr Gesamtpunktzahl für Teil III ist:</p>
                <div id="total-score">0</div>
                <p style="font-size: 0.8em; color: #7f8c8d;">Maximale Punktzahl: 132</p>
            </div>
            <div id="detailed-results"></div>
            <div class="results-actions">
                <button onclick="restart()">Neustart</button>
                <button onclick="printResults()">Drucken</button>
            </div>
        </div>
    </div>

<script>

        "options": [{"score": 0, "text": "Normal."}, {"score": 1, "text": "Angedeutet vorhanden: Geringfügige Verlangsamung oder Amplitudenreduktion."}, {"score": 2, "text": "Leicht ausgeprägt: Deutliche Verlangsamung/Amplitudenreduktion."}, {"score": 3, "text": "Mäßig ausgeprägt: Starke Beeinträchtigung, kann aber ausgeführt werden."}, {"score": 4, "text": "Schwer ausgeprägt: Kaum oder gar nicht durchführbar."}]
    },
    {
        "id": "3.7", "title": "3.7 Zehenklopfen", "parts": ["Rechter Fuß", "Linker Fuß"],
        "options": [{"score": 0, "text": "Normal."}, {"score": 1, "text": "Angedeutet vorhanden: Geringfügige Verlangsamung oder Amplitudenreduktion."}, {"score": 2, "text": "Leicht ausgeprägt: Deutliche Verlangsamung/Amplitudenreduktion."}, {"score": 3, "text": "Mäßig ausgeprägt: Starke Beeinträchtigung, kann aber ausgeführt werden."}, {"score": 4, "text": "Schwer ausgeprägt: Kaum oder gar nicht durchführbar."}]
    },
    {
        "id": "3.8", "title": "3.8 Beinbeweglichkeit", "parts": ["Rechtes Bein", "Linkes Bein"],
        "options": [{"score": 0, "text": "Normal."}, {"score": 1, "text": "Angedeutet vorhanden: Geringfügige Verlangsamung oder Amplitudenreduktion."}, {"score": 2, "text": "Leicht ausgeprägt: Deutliche Verlangsamung/Amplitudenreduktion."}, {"score": 3, "text": "Mäßig ausgeprägt: Starke Beeinträchtigung, kann aber ausgeführt werden."}, {"score": 4, "text": "Schwer ausgeprägt: Kaum oder gar nicht durchführbar."}]
    },
    {

        "options": [{"score": 0, "text": "Normal."}, {"score": 1, "text": "Langsam oder benötigt mehr als einen Versuch."}, {"score": 2, "text": "Stößt sich von den Armlehnen ab."}, {"score": 3, "text": "Tendiert dazu, zurückzufallen; mehrere Versuche nötig."}, {"score": 4, "text": "Kann ohne Hilfe nicht aufstehen."}]
    },
    {

        "options": [{"score": 0, "text": "Normal."}, {"score": 1, "text": "Leichte Schwierigkeiten, geringes Mitschwingen der Arme."}, {"score": 2, "text": "Deutliche Schwierigkeiten, benötigt aber keine Hilfe."}, {"score": 3, "text": "Starke Beeinträchtigung, benötigt Hilfe (Stock, etc.)."}, {"score": 4, "text": "Kann ohne fremde Hilfe nicht gehen."}]
    },
    {
        "id": "3.11", "title": "3.11 Freezing of Gait", "parts": ["Freezing"],
        "options": [{"score": 0, "text": "Kein Freezing."}, {"score": 1, "text": "Seltenes Freezing beim Gehen."}, {"score": 2, "text": "Gelegentliches Freezing beim Gehen."}, {"score": 3, "text": "Häufiges Freezing, gelegentliche Stürze."}, {"score": 4, "text": "Sehr häufiges Freezing, Unfähigkeit zu gehen."}]
    },
    {

        "options": [{"score": 0, "text": "Normal."}, {"score": 1, "text": "Retropulsion, erholt sich aber ohne Hilfe."}, {"score": 2, "text": "Benötigt Hilfe, um einen Sturz zu vermeiden."}, {"score": 3, "text": "Sehr instabil, neigt zu spontanen Stürzen."}, {"score": 4, "text": "Kann ohne Hilfe nicht stehen."}]

        "options": [{"score": 0, "text": "Normal."}, {"score": 1, "text": "Leicht gebeugt, aber normal für das Alter."}, {"score": 2, "text": "Mäßig gebeugt, kann sich aber aufrichten."}, {"score": 3, "text": "Stark gebeugt, kann sich nicht aufrichten."}, {"score": 4, "text": "Extrem gebeugte Haltung."}]

    },
    {

        "options": [{"score": 0, "text": "Kein Tremor."}, {"score": 1, "text": "Angedeutet vorhanden."}, {"score": 2, "text": "Leicht ausgeprägt (<2 cm)."}, {"score": 3, "text": "Mäßig ausgeprägt (2-4 cm)."}, {"score": 4, "text": "Schwer ausgeprägt (>4 cm)."}]
    },
    {
        "id": "3.16", "title": "3.16 Aktionstremor", "parts": ["Rechte Hand", "Linke Hand"],
        "options": [{"score": 0, "text": "Kein Tremor."}, {"score": 1, "text": "Angedeutet vorhanden."}, {"score": 2, "text": "Leicht ausgeprägt."}, {"score": 3, "text": "Mäßig ausgeprägt, beeinträchtigt die Aktivität."}, {"score": 4, "text": "Schwer ausgeprägt, behindert die Aktivität stark."}]
    },
    {
        "id": "3.17", "title": "3.17 Ruhetremor", "parts": ["Rechte obere Extremität", "Linke obere Extremität", "Rechte untere Extremität", "Linke untere Extremität", "Lippe/Kiefer"],
        "options": [{"score": 0, "text": "Kein Tremor."}, {"score": 1, "text": "Angedeutet und selten vorhanden."}, {"score": 2, "text": "Leicht in Amplitude und hartnäckig."}, {"score": 3, "text": "Mäßig in Amplitude und meist vorhanden."}, {"score": 4, "text": "Stark in Amplitude und die meiste Zeit vorhanden."}]
    },
    {
        "id": "3.18", "title": "3.18 Konstanz Ruhetremor", "parts": ["Konstanz"],
        "options": [{"score": 0, "text": "Kein Tremor."}, {"score": 1, "text": "<25% der Zeit vorhanden."}, {"score": 2, "text": "26-50% der Zeit vorhanden."}, {"score": 3, "text": "51-75% der Zeit vorhanden."}, {"score": 4, "text": ">75% der Zeit vorhanden."}]
    }
];

const flattenedQuestions = [];
originalQuestionsData.forEach(q => {
    q.parts.forEach(part => {
        flattenedQuestions.push({
            id: `${q.id}_${part.replace(/\s/g, '_')}`,
            title: q.parts.length > 1 ? `${q.title} - ${part}` : q.title,
            options: q.options
        });
    });
});

let currentPageIndex = 0;
const questionsPerPage = 1; 
const totalPages = Math.ceil(flattenedQuestions.length / questionsPerPage);
const userAnswers = {};

const questionContainer = document.getElementById('question-container');
const prevBtn = document.getElementById('prev-btn');
const nextBtn = document.getElementById('next-btn');
const progressBar = document.getElementById('progress-bar');
const progressText = document.getElementById('progress-text');
const resultsContainer = document.getElementById('results-container');
const navigation = document.getElementById('navigation');
const progressContainer = document.getElementById('progress-container');
const totalScoreEl = document.getElementById('total-score');
const detailedResultsEl = document.getElementById('detailed-results');

function renderPage() {
    questionContainer.innerHTML = '';
    window.scrollTo(0, 0);

    const startIndex = currentPageIndex * questionsPerPage;
    const question = flattenedQuestions[startIndex];
    renderSingleQuestion(question, startIndex);
    
    updateNavigation();
    updateProgressBar();
}

function renderSingleQuestion(question, questionIndex) {
    const questionWrapper = document.createElement('div');
    questionWrapper.className = 'question-wrapper';

    const questionTitle = document.createElement('div');
    questionTitle.className = 'question-title';
    questionTitle.textContent = question.title;
    questionWrapper.appendChild(questionTitle);

    question.options.forEach((option) => {
        const optionId = `q${questionIndex}_s${option.score}`;
        const optionName = `q${questionIndex}`;
        
        const optionDiv = document.createElement('div');
        optionDiv.className = 'option';
        
        const radioInput = document.createElement('input');
        radioInput.type = 'radio';
        radioInput.id = optionId;
        radioInput.name = optionName;
        radioInput.value = option.score;
        radioInput.onchange = () => {
            saveAnswer(question.id, option.score);
            checkCompletionAndAdvance();
        };

        if (userAnswers[question.id] !== undefined && userAnswers[question.id] === option.score) {
            radioInput.checked = true;
        }

        const label = document.createElement('label');
        label.htmlFor = optionId;
        label.innerHTML = `<span class="option-score">${option.score}:</span> ${option.text}`;
        
        optionDiv.appendChild(radioInput);
        optionDiv.appendChild(label);
        questionWrapper.appendChild(optionDiv);
    });

    questionContainer.appendChild(questionWrapper);
}

function saveAnswer(questionId, score) {
    userAnswers[questionId] = parseInt(score);
}

function checkCompletionAndAdvance() {
    const question = flattenedQuestions[currentPageIndex];
    if (userAnswers[question.id] !== undefined) {
        setTimeout(() => {
            // Re-check to ensure user is still on the same page
            if (question.id === flattenedQuestions[currentPageIndex].id) {
                nextPage();
            }
        }, 300);
    }
}

function updateNavigation() {
    prevBtn.disabled = currentPageIndex === 0;
    
    if (currentPageIndex === totalPages - 1) {
        nextBtn.textContent = 'Auswerten';
    } else {
        nextBtn.textContent = 'Weiter';
    }
}

function updateProgressBar() {
    const progress = ((currentPageIndex + 1) / totalPages) * 100;
    progressBar.style.width = `${progress}%`;
    progressText.textContent = `Frage ${currentPageIndex + 1} von ${totalPages}`;
}

function nextPage() {
    if (currentPageIndex < totalPages - 1) {
        currentPageIndex++;
        renderPage();
    } else {
        showResults();
    }
}

function prevPage() {
    if (currentPageIndex > 0) {
        currentPageIndex--;
        renderPage();
    }
}

function showResults() {
    let totalScore = 0;
    let detailedHtml = '<h3>Detailergebnisse</h3><table><thead><tr><th>Frage</th><th>Punkte</th></tr></thead><tbody>';

    flattenedQuestions.forEach(question => {
        const score = userAnswers[question.id] !== undefined ? userAnswers[question.id] : 0;
        totalScore += score;
        detailedHtml += `
            <tr>
                <td>${question.title}</td>
                <td class="score-cell">${score}</td>
            </tr>
        `;
    });

    detailedHtml += '</tbody></table>';

    questionContainer.style.display = 'none';
    navigation.style.display = 'none';
    progressContainer.style.display = 'block';
    document.getElementById('progress-text').textContent = "Auswertung abgeschlossen";
    resultsContainer.style.display = 'block';
    
    totalScoreEl.textContent = totalScore;
    detailedResultsEl.innerHTML = detailedHtml;
}

function restart() {
    currentPageIndex = 0;
    for(const key in userAnswers) {
        delete userAnswers[key];
    }
    
    questionContainer.style.display = 'block';
    navigation.style.display = 'flex';
    resultsContainer.style.display = 'none';
    detailedResultsEl.innerHTML = '';

    renderPage();
}

function handleKeyPress(event) {
    if (resultsContainer.style.display === 'block' || !['0', '1', '2', '3', '4'].includes(event.key)) return;
    
    event.preventDefault();
    const score = parseInt(event.key);
    
    const questionIndex = currentPageIndex;
    const question = flattenedQuestions[questionIndex];

    if (userAnswers[question.id] === undefined) {
        const radioToSelect = document.querySelector(`input[name="q${questionIndex}"][value="${score}"]`);
        if (radioToSelect) {
            radioToSelect.checked = true;
            radioToSelect.dispatchEvent(new Event('change', { bubbles: true }));
        }
    }
}

function printResults() {
    window.print();
}

// Initial Setup
document.addEventListener('DOMContentLoaded', renderPage);
document.addEventListener('keydown', handleKeyPress);

</script>

</body>
</html>
